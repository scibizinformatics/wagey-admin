server {
  listen 80;
  server_name web.wageyapp.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name web.wageyapp.com;

  ssl_certificate /etc/letsencrypt/live/web.wageyapp.com-0001/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/web.wageyapp.com-0001/privkey.pem; 

  # HSTS belongs on the TLS server only (browsers ignore it over plain HTTP,
  # and the :80 block above never serves content).
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # The CSP is split across two layers on purpose. script-src has to name the
  # sha256 of the inline legacy-alias redirect in index.html, and that digest is
  # regenerated by every build; server.js computes it from the file it actually
  # serves. Cross-origin sources (API and WebSocket hosts) are build-time
  # configuration there too. Repeating a fixed policy here would be a second
  # policy — browsers enforce the intersection — and would block the redirect as
  # soon as the build changed, so this block states only the directives that
  # depend on nothing per build.
  add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

<!doctype html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Android / PWA -->
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png" />

    <!-- Web Manifest -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- SPA redirect: map old alias paths to hash-based routes -->
    <script>
      (function () {
        var path = location.pathname
        var hash = location.hash
        var redirectMap = {
          '/dashboard': '/app',
          '/employees': '/app/employees',
          '/invite': '/app/employees/invite',
          '/schedule': '/app/schedule',
          '/requests': '/app/requests',
          '/swap-requests': '/app/swap-requests',
          '/payroll': '/app/payroll',
          '/announcements': '/app/announcements',
          '/admin-settings': '/app/admin-settings',
        }
        var target = redirectMap[path]
        if (target && !hash) {
          location.replace('/#' + target)
        }
      })()
    </script>
  </head>
  <body>
    <div id="q-app"><!-- quasar:entry-point --></div>
  </body>
</html>
